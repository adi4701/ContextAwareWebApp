name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'phase-*'
  pull_request:
    branches:
      - main
      - master

jobs:
  # ── ML SERVICE TEST SUITE ──────────────────────────────────────────────────
  ml-service-tests:
    name: ML Service (Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model artifacts (if needed)
        run: |
          python train.py

      - name: Run pytest contract tests
        run: |
          python -m pytest tests/test_predict.py -v

  # ── BACKEND TEST SUITE ─────────────────────────────────────────────────────
  backend-tests:
    name: Backend API (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run unit & validation tests
        run: npm test

  # ── FRONTEND BUILD & LINT ──────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:5000
